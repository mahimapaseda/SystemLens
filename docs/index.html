<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="description" content="Free Windows PC health check. Monitor battery, heat, storage, CPU, and more — then download the installer." />

  <meta property="og:type" content="website" />

  <meta property="og:title" content="SystemLens — Free PC Health Check for Windows" />
  <meta property="og:description" content="Free Windows PC health check with scores and exportable reports." />
  <meta property="og:image" content="https://mahimapaseda.github.io/SystemLens/screenshots/dashboard.png" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="SystemLens — Free PC Health Check for Windows" />
  <meta name="twitter:description" content="Free Windows PC health check with scores and exportable reports." />
  <meta name="twitter:image" content="https://mahimapaseda.github.io/SystemLens/screenshots/dashboard.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "SystemLens",
    "applicationCategory": "UtilitiesApplication",
    "operatingSystem": "Windows",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
    "description": "Free PC health check for Windows.",
    "url": "https://mahimapaseda.github.io/SystemLens/",
    "downloadUrl": "https://github.com/mahimapaseda/SystemLens/releases/latest/download/SystemLens-Setup-Windows.exe",
    "softwareVersion": "4.3.0",
    "license": "https://opensource.org/licenses/MIT",
    "author": { "@type": "Person", "name": "Mahima Paseda" }
  }
  </script>

  <style>
    :root {
      --bg: #061018;
      --teal: #2dd4a8;
      --text: #e8f4f0;
      --muted: #8aa8a0;
      --line: rgba(45, 212, 168, 0.18);
      --display: "Outfit", sans-serif;
      --body: "DM Sans", sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--body);
      color: var(--text);
      background: var(--bg);
      min-height: 100vh;
      min-height: 100dvh;
    }
    a { color: var(--teal); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .hero {
      position: relative;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      overflow: hidden;
      isolation: isolate;
    }
    .hero-bg {
      position: absolute;
      inset: 0;
      z-index: -2;
      background:
        linear-gradient(160deg, #041018 0%, #0a2430 42%, #063028 100%),
        radial-gradient(ellipse 80% 60% at 70% 40%, rgba(45, 212, 168, 0.22), transparent 55%);
    }
    .hero-visual {
      position: absolute;
      inset: 0;
      z-index: -1;
    }
    .hero-visual img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      opacity: 0.4;
      animation: ken 18s ease-in-out infinite alternate;
    }
    .hero-visual::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to top,
        var(--bg) 10%,
        rgba(6, 16, 24, 0.7) 40%,
        rgba(6, 16, 24, 0.4) 100%
      );
    }
    .nav {
      position: absolute;
      top: 0; left: 0; right: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.25rem 6vw;
    }
    .nav-brand {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      color: var(--text);
      font-family: var(--display);
      font-weight: 700;
      text-decoration: none;
    }
    .nav-brand img { width: 34px; height: 34px; border-radius: 8px; }
    .nav-brand:hover { text-decoration: none; }
    .nav a.git {
      color: var(--muted);
      font-size: 0.9rem;
    }
    .nav a.git:hover { color: var(--text); text-decoration: none; }

    .content {
      padding: 0 6vw 12vh;
      max-width: 720px;
      animation: rise 0.85s ease-out both;
    }
    .brand {
      font-family: var(--display);
      font-weight: 800;
      font-size: clamp(2.75rem, 8vw, 4.5rem);
      letter-spacing: -0.03em;
      line-height: 1.05;
      margin-bottom: 0.75rem;
    }
    .brand span { color: var(--teal); }
    h1 {
      font-family: var(--display);
      font-weight: 600;
      font-size: clamp(1.15rem, 2.5vw, 1.5rem);
      margin-bottom: 0.7rem;
      max-width: 28ch;
    }
    .lead {
      color: var(--muted);
      font-size: 1.05rem;
      max-width: 36ch;
      margin-bottom: 1.6rem;
    }
    .cta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.85rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: var(--display);
      font-weight: 600;
      font-size: 0.95rem;
      padding: 0.85rem 1.4rem;
      border-radius: 10px;
      text-decoration: none;
      transition: transform 0.2s ease, background 0.2s ease;
    }
    .btn:hover { text-decoration: none; transform: translateY(-1px); }
    .btn-primary {
      background: var(--teal);
      color: #042018;
      box-shadow: 0 8px 28px rgba(45, 212, 168, 0.22);
    }
    .btn-primary:hover { background: #5eead4; color: #042018; }
    .btn-ghost {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--line);
    }
    .btn-ghost:hover { border-color: var(--teal); color: var(--teal); }

    footer {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 1rem 6vw 1.25rem;
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 0.8rem;
      border-top: 1px solid transparent;
    }
    footer a { color: var(--muted); }
    footer a:hover { color: var(--teal); }

    @keyframes rise {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes ken {
      from { transform: scale(1); }
      to { transform: scale(1.05); }
    }
    @media (max-width: 720px) {
      .content { padding-bottom: 9vh; }
      .brand { font-size: clamp(2.4rem, 12vw, 3.2rem); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="hero">
    <div class="hero-bg" aria-hidden="true"></div>
    <div class="hero-visual">
      <img
        src="screenshots/dashboard.png"
        alt="SystemLens PC health check dashboard"
        width="1600"
        height="900"
      />
    </div>

    <nav class="nav" aria-label="Primary">
      <a class="nav-brand" href="#">
        <img src="branding/logo.png" alt="" width="34" height="34" />
        SystemLens
      </a>
      <a class="git" href="https://github.com/mahimapaseda/SystemLens">GitHub</a>
    </nav>

    <div class="content">
      <p class="brand">System<span>Lens</span></p>
      <h1>PC health check for Windows</h1>
      <p class="lead">See battery, heat, storage, and performance in one score — then export a report when you need it.</p>
      <div class="cta">
        <a
          class="btn btn-primary"
          href="https://github.com/mahimapaseda/SystemLens/releases/latest/download/SystemLens-Setup-Windows.exe"
          download
        >Download for Windows</a>
        <a class="btn btn-ghost" href="https://github.com/mahimapaseda/SystemLens">View source</a>
      </div>
    </div>

    <footer>
      <p>© SystemLens · MIT · <a href="https://mahimapaseda.vercel.app/">Mahima Paseda</a></p>
      <p><a href="https://github.com/mahimapaseda/SystemLens/releases">Releases</a></p>
    </footer>
  </main>
</body>
</html>
